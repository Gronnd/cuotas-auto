name: remote
on:
    workflow_dispatch:

concurrency:
    group: cuotas
    cancel-in-progress: false   # no matar una ejecución a mitad de escribir en las hojas

jobs:
    ejecutar-script:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        container: rocker/tidyverse:4.5

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Paquetes que no trae la imagen
              run: |
                  Rscript -e 'p <- c("googlesheets4","httr","jsonlite","base64enc","lubridate"); f <- p[!vapply(p, requireNamespace, logical(1), quietly = TRUE)]; if (length(f)) install.packages(f)'

            - name: Autenticar y ejecutar script R
              env:
                  GDRIVE_TOKEN: ${{ secrets.OAUTH_TOKEN2 }}
                  IMPORTACIONES_URL: ${{ secrets.IMPORTACIONES_URL }}
                  CREDENCIALES_URL: ${{ secrets.CREDENCIALES_URL }}
              run: Rscript update_sheets.R
