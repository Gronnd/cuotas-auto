name: remote
on:
    workflow_dispatch:

concurrency:
    group: cuotas
    cancel-in-progress: false

jobs:
    ejecutar-script:
        runs-on: ubuntu-24.04      # imagen madura en vez de ubuntu-latest (= 26 ahora)
        timeout-minutes: 15        # si se cuelga, muere en 15 min y no en 57

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Configurar R
              uses: r-lib/actions/setup-r@v2
              with:
                  r-version: '4.6.1'
                  use-public-rspm: true

            - name: Install packages
              uses: r-lib/actions/setup-r-dependencies@v2
              with:
                  packages: |
                      any::googlesheets4
                      any::googledrive
                      any::httr
                      any::jsonlite
                      any::base64enc
                      any::curl
                      any::dotenv
                      any::lubridate

            - name: Autenticar y ejecutar script R
              env:
                  GDRIVE_TOKEN: ${{ secrets.OAUTH_TOKEN2 }}
                  IMPORTACIONES_URL: ${{ secrets.IMPORTACIONES_URL }}
                  CREDENCIALES_URL: ${{ secrets.CREDENCIALES_URL }}
              run: Rscript update_sheets.R
